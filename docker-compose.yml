services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hemocax
      POSTGRES_USER: hemocax
      POSTGRES_PASSWORD: hemocax
    ports: ["5432:5432"]
    volumes: ["hemocax_pg:/var/lib/postgresql/data"]
  automations:
    build: ./automations
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    environment:
      HEMOCAX_API_URL: http://host.docker.internal:3000
      AUTOMATION_HOST: 0.0.0.0
      AUTOMATIONS_ENABLED: ${AUTOMATIONS_ENABLED:-false}
      AUTOMATION_DRY_RUN: ${AUTOMATION_DRY_RUN:-true}
      AUTOMATION_RUN_SECRET: ${AUTOMATION_RUN_SECRET:-}
      AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-}
      AUTOMATION_TIMEZONE: America/Lima
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-HEMOCAX - Banco de Sangre HRDC}
volumes:
  hemocax_pg:
